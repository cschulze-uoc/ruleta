[versions]
agp = "9.0.1"
appcompat = "1.7.1"
coreKtx = "1.17.0"
credentials = "1.3.0"
credentialsPlayServicesAuth = "1.3.0"
firebaseBom = "34.13.0"
googleid = "1.1.1"
junit = "4.13.2"
